[workspace]
resolver = "2"
members = ["crates/shrinkfit", "crates/shrinkfit-cli", "crates/shrinkfit-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/timesler/shrinkfit"
rust-version = "1.70"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
