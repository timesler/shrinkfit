[package]
name = "shrinkfit"
description = "Shrink JSON/YAML payloads to fit a character budget while preserving their schema and structure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["json", "yaml", "truncate", "llm", "agents"]
categories = ["encoding", "text-processing"]
readme = "../../README.md"

[dependencies]
# Optional, so the default core stays dependency-free and builds anywhere,
# including wasm32-unknown-unknown without wasm-bindgen.
yaml-rust2 = { version = "0.11", optional = true }

# Only built where the OS has a network stack: never for wasm, where the `jev`
# feature is accepted but cannot make requests.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[features]
default = []
# Optional scoring by a hosted decision model (see src/jev.rs). Off by default so
# the core stays dependency-free; it also needs an OpenRouter API key at run time.
jev = ["dep:ureq"]
# Native YAML input. Emitting YAML never needs it.
yaml = ["dep:yaml-rust2"]
