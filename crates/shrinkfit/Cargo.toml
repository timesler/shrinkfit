[package]
name = "shrinkfit"
description = "Shrink JSON/YAML payloads to fit a character budget while preserving their schema and structure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["json", "yaml", "truncate", "llm", "agents"]
categories = ["encoding", "text-processing"]
readme = "../../README.md"

[dependencies]
# Optional, so the default core stays dependency-free and builds anywhere,
# including wasm32-unknown-unknown without wasm-bindgen.
yaml-rust2 = { version = "0.11", optional = true }

# The HTTP client for model scoring. Only built where the OS has sockets: never
# for wasm, where the host (JavaScript `fetch`) sends the request instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[features]
default = []
# Let the core send model-scoring requests itself (src/jev.rs). Off by default so
# the core stays dependency-free; the CLI and the native FFI library turn it on.
jev = ["dep:ureq"]
# Native YAML input. Emitting YAML never needs it.
yaml = ["dep:yaml-rust2"]
