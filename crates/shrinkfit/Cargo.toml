[package]
name = "shrinkfit"
description = "Shrink JSON/YAML payloads to fit a character budget while preserving their schema and structure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords = ["json", "yaml", "truncate", "llm", "agents"]
categories = ["encoding", "text-processing"]
readme = "../../README.md"

[dependencies]
# Optional, so the default core stays dependency-free and builds anywhere,
# including wasm32-unknown-unknown without wasm-bindgen.
yaml-rust2 = { version = "0.11", optional = true }

[features]
default = []
# Native YAML input. Emitting YAML never needs it.
yaml = ["dep:yaml-rust2"]
