name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p shrinkfit  # default features: dependency-free core
      - run: cargo test --workspace --release

  python:
    needs: rust
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install wheel
        working-directory: bindings/python
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/*.whl
      - name: Test installed package
        working-directory: bindings/python/tests
        run: python -m unittest -v

  typescript:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Each step reports the tail of its output as an error annotation on
      # failure, so the cause is visible from the run summary and the API.
      - name: npm install
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm install > step.log 2>&1 && status=0 || status=$?
          cat step.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 3000 step.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=npm install failed::$msg"
            exit "$status"
          fi
      - name: Build WASM
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm run build:wasm > step.log 2>&1 && status=0 || status=$?
          cat step.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 3000 step.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build WASM failed::$msg"
            exit "$status"
          fi
      - name: Compile TypeScript
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm run build:ts > step.log 2>&1 && status=0 || status=$?
          cat step.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 3000 step.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Compile TypeScript failed::$msg"
            exit "$status"
          fi
      - name: Test
        working-directory: bindings/typescript
        shell: bash
        run: |
          npm test > step.log 2>&1 && status=0 || status=$?
          cat step.log
          if [ "$status" -ne 0 ]; then
            msg=$(tail -c 3000 step.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failed::$msg"
            exit "$status"
          fi
