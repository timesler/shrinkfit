[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shrinkfit"
version = "0.1.0"
description = "Shrink JSON/YAML payloads to fit a character budget while preserving their schema and structure"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
keywords = ["json", "yaml", "truncate", "llm", "agents", "context-window"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/timesler/shrinkfit"

[tool.setuptools]
packages = ["shrinkfit"]

[tool.setuptools.package-data]
shrinkfit = ["_native/*", "py.typed"]
